# yurika.space — local development stack
# All services have explicit memory + CPU caps to prevent RAM exhaustion.
# Total memory cap when all services are running: ~3.5 GB
#
# Verify gate (subsystem 1):
#   docker compose up -d
#   docker compose ps           # all services should be "healthy"
#   curl http://localhost:8000/health/   # -> 200 OK
#   curl http://localhost:3001/          # -> 200 OK
#
# To enable Celery worker (subsystem 8), uncomment the celery-worker service.

x-mem-defaults: &mem-defaults
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *mem-defaults
    image: postgres:16-alpine
    container_name: yurika_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yurika_space}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yurika_space}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  neo4j:
    <<: *mem-defaults
    image: neo4j:5-community
    container_name: yurika_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      # JVM heap + page cache caps — must fit inside container mem_limit
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # Disable bloom/APOC unless needed — saves memory
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"   # HTTP browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 1.5
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'

  redis:
    <<: *mem-defaults
    image: redis:7-alpine
    container_name: yurika_redis
    command: >
      redis-server
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  django:
    <<: *mem-defaults
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: yurika_django
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-yurika_space}
      REDIS_URL: redis://redis:6379/0
      NEO4J_BOLT_URL: bolt://neo4j:password@neo4j:7687
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health/\", timeout=3).status==200 else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Uncomment when subsystem 8 (Celery tasks) comes online.
  # celery-worker:
  #   <<: *mem-defaults
  #   build:
  #     context: ./apps/backend
  #     dockerfile: Dockerfile
  #   container_name: yurika_celery
  #   command: celery -A config worker --loglevel=info --concurrency=1
  #   environment:
  #     DJANGO_SETTINGS_MODULE: config.settings.local
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-yurika_space}
  #     REDIS_URL: redis://redis:6379/0
  #     NEO4J_BOLT_URL: bolt://neo4j:password@neo4j:7687
  #     SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
  #   volumes:
  #     - ./apps/backend:/app
  #   depends_on:
  #     django:
  #       condition: service_healthy
  #   mem_limit: 384m
  #   mem_reservation: 192m
  #   cpus: 0.5
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 384M
  #         cpus: '0.5'

  nextjs:
    <<: *mem-defaults
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: yurika_nextjs
    command: pnpm dev
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=768
      # Browser-side requests (rendered HTML hits the user's machine, not the container network)
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
      # Server-side fetches from inside the container go over the docker network.
      # Note the /api suffix so the server-side and browser-side URLs are symmetric.
      INTERNAL_API_BASE_URL: http://django:8000/api
    ports:
      - "3001:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 1.5
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
